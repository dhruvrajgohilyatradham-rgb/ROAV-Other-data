<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GD Analysis Dashboard</title>
<style>
body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:#f2f4fb;color:#1b2236}
header{background:linear-gradient(120deg,#1e1b4b,#4f46e5);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:1.4em}main{padding:14px 22px;max-width:1700px;margin:auto}
.card{background:#fff;border:1px solid #e6eaf3;border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.slot{background:#f8f9fe;border:1px dashed #a5b4fc;border-radius:10px;padding:10px}
.mut{color:#6c768c}.ok{color:#16a34a}.bad{color:#dc2626}.warn{color:#d97706}
button,select,input[type=text]{font:inherit;border:1px solid #d5dbec;border-radius:8px;padding:6px 10px;background:#fff}
button.b{background:#4f46e5;color:#fff;border:0;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border-radius:999px;cursor:pointer}.tabs button.on{background:#4f46e5;color:#fff}
.wrap{overflow:auto;max-height:70vh;border:1px solid #e6eaf3;border-radius:10px;margin:6px 0 16px;background:#fff}
table{border-collapse:separate;border-spacing:0;font-size:.92em;width:100%}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid #eef0f6}
th{position:sticky;top:0;background:#e9edfa;z-index:2}
td:first-child,th:first-child{position:sticky;left:0;text-align:left;font-weight:600;background:#fff;z-index:1}th:first-child{background:#e9edfa;z-index:3}
tr.tot td{font-weight:700;background:#eef1fa;position:sticky;bottom:0}
.up{color:#16a34a;font-weight:700}.dn{color:#dc2626;font-weight:700}
.map{display:grid;grid-template-columns:140px 1fr;gap:4px 8px;margin-top:6px;align-items:center;font-size:.88em}
#cl{width:100%;height:150px}.flt{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
</style></head><body>
<header><div><h1>GD Analysis Dashboard</h1><small>ROAV + Orders · hour, city, state, platform</small></div><div>🔒 Data is processed in your browser only</div></header>
<main>
<div class="card"><b>Upload CSVs</b> <span class="mut">(any one file alone is fine; yesterday / 2 days ago are optional)</span>
<div class="g" id="slots" style="margin-top:8px"></div><div class="g" id="maps"></div><div id="chk" style="margin-top:8px"></div></div>
<div class="card"><div class="flt">
<div><label>Day shown in tabs</label><br><select id="dsel"></select></div>
<label><input type="checkbox" id="dd"> Count each Product / Booking ID only once per hour (untick = count every CSV row)</label>
<div style="flex:1;min-width:260px"><label>City filter — search, Ctrl+click for several</label><br><input type="text" id="cs" placeholder="Search city…" style="width:100%;margin-bottom:4px"><select id="cl" multiple></select>
<button id="ca">Select all shown</button> <button id="cx">Clear (= all cities)</button> <span id="cn" class="mut"></span></div>
<button class="b" id="ex">⬇ Export Excel</button></div></div>
<div class="tabs" id="tabs"></div><div id="out"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
"use strict";
/* ===== EDIT THESE LISTS if your statuses change (matching ignores case/extra spaces) ===== */
const PENDING=['Pending','Pending Payment','Folloup Pending','Followup Pending'];
const BOOKED=['Processing','Payment Received','Enquiry Sent','Complete_All','Complete With SMS','Complete With Email','Complete Cancel','Complete','Cancelled due to Booking not available','Completed with NEFT','Payment Initiation'];
/* ROAV reason rules: contains ABD / OPT as a word; Blocking or No Inventory = Blocking; Book Now */
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const HL=h=>String(h),HRS=[...Array(24).keys()];
const nm=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-IN'),P=(a,b)=>b?a/b*100:null;
const PE=new Set(PENDING.map(nm)),BK=new Set(BOOKED.map(nm));
const w=x=>new RegExp('(^|[^a-z])'+x+'([^a-z]|$)');const RA=w('abd'),RO=w('opt');
function kR(t){t=nm(t);if(/blocking|no[\s_-]*inventory/.test(t))return'bl';if(RA.test(t))return'abd';if(RO.test(t))return'opt';if(/book[\s_-]*now/.test(t))return'bn';return'ot'}
function parseCSV(t){if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);const rows=[];let r=[],f='',q=false,i=0;const n=t.length;
 while(i<n){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
 else if(c==='"')q=true;else if(c===','){r.push(f);f=''}
 else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else f+=c;i++}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDT(v){let s=String(v??'').replace(/\u00a0/g,' ').trim();if(!s)return null;let m,d,mo,y,h,mi,se,ap;
 if(/^\d{5}(\.\d+)?$/.test(s)){const n=parseFloat(s),t=Math.round((n-Math.floor(n))*86400);return{h:Math.floor(t/3600)%24,mi:Math.floor(t%3600/60),se:t%60,key:Math.floor(n),lab:'Day '+Math.floor(n)}}
 if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})[ T,]+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?(?:\.\d+)?\s*([AaPp][Mm])?/))){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;h=+m[4];mi=+m[5];se=+(m[6]||0);ap=m[7]}
 else if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/))){y=+m[1];mo=+m[2];d=+m[3];h=+m[4];mi=+m[5];se=+(m[6]||0);ap=m[7]}
 else if((m=s.match(/^(\d{1,2})[ ,-]+([A-Za-z]{3,9})[ ,-]+(\d{4})[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/))&&(mo=MON.indexOf(m[2].slice(0,3).toLowerCase())+1)){d=+m[1];y=+m[3];h=+m[4];mi=+m[5];se=+(m[6]||0);ap=m[7]}
 else return null;
 if(ap){ap=ap.toLowerCase();if(h<1||h>12)return null;if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0}
 if(h>23||mi>59||se>59||mo<1||mo>12||d<1||d>31)return null;
 return{h,mi,se,key:y*10000+mo*100+d,lab:pad(d)+'-'+pad(mo)+'-'+y}}

/* ===== state ===== */
const DN=['Today','Yesterday','2 Days Ago'];
const FLD={R:[['date','Date & time',1],['id','Product ID',0],['reason','Reason',1],['city','City',1]],
 O:[['date','Date & time',1],['id','Booking ID',0],['status','Status',1],['city','City (optional)',0],['ps','Product State',0],['cs','State (customer)',0],['pl','Platform',0]]};
const AD=['last update','last updated','updated at','booked on','booking date','order date','created at','created on','date','timestamp'];
const AL={date:AD,id:{R:['product id','productid','product_id'],O:['booking id','bookingid','booking_id','order id']},reason:['reason','roav reason'],city:['city','city name','product city'],status:['status','order status','booking status'],ps:['product state'],cs:['state','customer state'],pl:['platform','booking platform','source']};
const al=(k,f)=>{const a=AL[f];return Array.isArray(a)?a:a[k]};
const F={R:[null,null,null],O:[null,null,null]},D={R:[null,null,null],O:[null,null,null]},MH={},MAP={},LBL={},CN=new Map();
let CS=new Set(),info={},day=0,cur=0,VIS=[];const V={xm:'r',cm:'r',cd:'h',sm:'bk'};
const auto=(k,hd)=>{const m={};FLD[k].forEach(([f])=>m[f]=hd.findIndex(h=>al(k,f).includes(nm(h))));return m};
const cm=(k,hd)=>{const m={};FLD[k].forEach(([f])=>{const s=MAP[k][f];m[f]=s>=0?hd.findIndex(h=>nm(h)===nm(MH[k][s])):-1});return m};
const grp=(a,f)=>{const m=new Map();a.forEach(x=>{const k=f(x);(m.get(k)||m.set(k,[]).get(k)).push(x)});return m};
const g2=(rs,os,f)=>{const m=new Map(),g=k=>m.get(k)||m.set(k,{r:[],o:[]}).get(k);rs.forEach(x=>g(f(x)).r.push(x));os.forEach(x=>g(f(x)).o.push(x));return m};
function S(rs,os){const s={r:rs.length,abd:0,opt:0,bl:0,bn:0,ot:0,o:os.length,pe:0,bk:0,oo:0};rs.forEach(x=>{if(s[x.k]!==undefined)s[x.k]++});os.forEach(x=>{if(x.k==='pe')s.pe++;else if(x.k==='bk')s.bk++;else s.oo++});return s}
/* [id,label,fn,isPercent,side] */
const MET=[['r','ROAV',s=>s.r,0,'R'],['abd','ABD',s=>s.abd,0,'R'],['abdp','ABD %',s=>P(s.abd,s.r),1,'R'],['opt','OPT',s=>s.opt,0,'R'],['optp','OPT %',s=>P(s.opt,s.r),1,'R'],
['bl','Blocking + No Inventory',s=>s.bl,0,'R'],['blp','Blocking %',s=>P(s.bl,s.r),1,'R'],['bn','Book Now',s=>s.bn,0,'R'],['bnp','Book Now %',s=>P(s.bn,s.r),1,'R'],['ot','Other reasons (in no group)',s=>s.ot,0,'R'],
['o','Orders',s=>s.o,0,'O'],['bno','Book Now → Order %',s=>P(s.o,s.bn),1,'B'],['pe','Pending',s=>s.pe,0,'O'],['bk','Booked',s=>s.bk,0,'O'],['oo','Other status (in no group)',s=>s.oo,0,'O'],['obk','Order → Booked %',s=>P(s.bk,s.o),1,'O']];
const MR=['r','abd','abdp','opt','optp','bl','blp','bn','bnp','ot'];
const val=(m,s,hr,ho)=>(m[4]==='R'&&!hr)||(m[4]==='O'&&!ho)||(m[4]==='B'&&!(hr&&ho))?null:m[2](s);
const show=(m,v)=>v==null?'-':m[3]?v.toFixed(1)+'%':fmt(v);
const lb=i=>LBL['R'+i]||LBL['O'+i]||'';

/* ===== load + prepare ===== */
function rd(file,ok,bad){const fr=new FileReader();fr.onload=()=>setTimeout(()=>{try{const r=parseCSV(fr.result);if(r.length<2)throw new Error('No data rows');ok({name:file.name,hd:r[0].map(x=>x.trim()),rows:r.slice(1)})}catch(e){bad(e.message)}},10);fr.onerror=()=>bad('Could not read file');fr.readAsText(file)}
const DSEL={};
function prep(k,i,raw,m){const q={n:raw.rows.length,bad:0,other:0,rep:0,ded:0,key:null,unc:new Map(),dates:new Map(),labs:new Set()},out=new Map(),lst=[],seen=new Set(),dd=$('dd').checked,ds=DSEL[k+i]||'',g=(r,j)=>j>=0?String(r[j]??'').trim():'';let fk=null;
 raw.rows.forEach(r=>{const dt=parseDT(r[m.date]);if(!dt){q.bad++;return}q.dates.set(dt.lab,(q.dates.get(dt.lab)||0)+1);
  if(ds&&dt.lab!==ds){q.other++;return}q.labs.add(dt.lab);fk=dt.key;
  const ct=g(r,m.city),c=nm(ct)||'(no city)';if(!CN.has(c))CN.set(c,ct||'(No city)');
  const t=g(r,k==='R'?m.reason:m.status);let kk;
  if(k==='R')kk=kR(t);else{const n=nm(t);kk=PE.has(n)?'pe':BK.has(n)?'bk':'ot'}
  if(kk==='ot'){const u=t||'(empty)';q.unc.set(u,(q.unc.get(u)||0)+1)}
  const x={h:dt.h,t:dt.h*3600+dt.mi*60+dt.se,c,k:kk,ps:g(r,m.ps)||'(blank)',cs:g(r,m.cs)||'(blank)',pl:g(r,m.pl)||'(blank)'},id=g(r,m.id);
  if(id){const sk=dt.key+'|'+id;if(seen.has(sk))q.rep++;else seen.add(sk)}
  if(dd&&id){const key=dt.key+'|'+dt.h+'|'+id,o=out.get(key);if(o)q.ded++;if(!o||x.t>=o.t)out.set(key,x)}else lst.push(x)});
 const recs=[...out.values(),...lst];q.used=recs.length;q.lab=[...q.labs].slice(0,3).join(', ');if(q.labs.size===1)q.key=fk;return{recs,q}}
function proc(){info={};['R','O'].forEach(k=>[0,1,2].forEach(i=>{D[k][i]=null;const raw=F[k][i];if(!raw||!MH[k])return;const m=cm(k,raw.hd),ms=FLD[k].filter(f=>f[2]&&m[f[0]]<0);
 if(ms.length){info[k+i]={err:'Columns not found: '+ms.map(f=>f[1]).join(', ')};return}const p=prep(k,i,raw,m);D[k][i]=p.recs;info[k+i]=p.q;LBL[k+i]=p.q.lab}));
 if(!D.R[day]&&!D.O[day]){const d=[0,1,2].find(i=>D.R[i]||D.O[i]);if(d!==undefined)day=d}
 drawChk();drawCities();drawDay();render()}
const fR=i=>D.R[i]?(CS.size?D.R[i].filter(x=>CS.has(x.c)):D.R[i]):null;
const fO=i=>D.O[i]?(CS.size&&MAP.O.city>=0?D.O[i].filter(x=>CS.has(x.c)):D.O[i]):null;

/* ===== upload UI ===== */
$('slots').innerHTML=['R','O'].map(k=>[0,1,2].map(i=>'<div class="slot"><b>'+(k==='R'?'ROAV':'Order')+' — '+DN[i]+'</b><br><input type="file" accept=".csv,text/csv" data-k="'+k+'" data-i="'+i+'"><div id="st'+k+i+'" class="mut">Not loaded</div></div>').join('')).join('');
function drawMaps(){$('maps').innerHTML=['R','O'].filter(k=>MH[k]).map(k=>'<div><b>'+(k==='R'?'ROAV':'Order')+' columns</b> <span class="mut">(* required; guessed from names)</span><div class="map">'+FLD[k].map(([f,l,r])=>'<label>'+l+(r?' *':'')+'</label><select data-k="'+k+'" data-m="'+f+'"><option value="-1">— not used —</option>'+MH[k].map((h,i)=>'<option value="'+i+'"'+(MAP[k][f]===i?' selected':'')+'>'+esc(h)+'</option>').join('')+'</select>').join('')+'</div></div>').join('')}
function drawChk(){const L=[],v=x=>info[x]&&!info[x].err?info[x]:null;
 Object.entries(info).forEach(([k,q])=>{const n='<b>'+(k[0]==='R'?'ROAV':'Order')+' · '+DN[+k[1]]+'</b>';if(q.err){L.push('<div class="bad">'+n+': '+esc(q.err)+'</div>');return}
  const ok=q.n===q.used+q.bad+q.other+q.ded;
  let h='<div>'+n+': '+fmt(q.n)+' rows = counted <b>'+fmt(q.used)+'</b>'+(q.ded?' + '+fmt(q.ded)+' repeated IDs ignored':'')+(q.bad?' + <span class="bad">'+fmt(q.bad)+' skipped (date not understood)</span>':'')+(q.other?' + '+fmt(q.other)+' rows of other dates':'')+(ok?' <span class="ok">✔ adds up</span>':' <span class="bad">✖ does not add up</span>')+' · date: '+esc(q.lab||'-');
  if(q.dates.size>1)h+='<br><span class="warn">⚠ this file has '+q.dates.size+' different dates, so hours are mixed. Use only: </span><select data-ds="'+k+'"><option value="">All dates (mixed)</option>'+[...q.dates].map(([l,c])=>'<option value="'+esc(l)+'"'+(DSEL[k]===l?' selected':'')+'>'+esc(l)+' ('+fmt(c)+' rows)</option>').join('')+'</select>';
  if(q.rep&&!$('dd').checked)h+='<br><span class="warn">'+fmt(q.rep)+' rows repeat an ID already seen on the same date. Every row is counted; tick “only once per hour” above to ignore repeats inside the same hour.</span>';
  if(q.unc.size)h+='<br><span class="warn">'+(k[0]==='R'?'Reasons':'Statuses')+' in no group (shown in the “Other” column): '+[...q.unc].sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>esc(x[0])+' ('+fmt(x[1])+')').join(', ')+'</span>';
  L.push(h+'</div>')});
 ['R','O'].forEach(k=>[[0,1],[0,2],[1,2]].forEach(([a,b])=>{const A=v(k+a),B=v(k+b);if(A&&B&&A.key&&B.key){if(A.key===B.key)L.push('<div class="bad">⚠ '+(k==='R'?'ROAV':'Order')+' '+DN[a]+' and '+DN[b]+' files have the same date ('+esc(A.lab)+') — wrong file in a slot?</div>');else if(A.key<B.key)L.push('<div class="bad">⚠ '+(k==='R'?'ROAV':'Order')+' '+DN[a]+' ('+esc(A.lab)+') is older than '+DN[b]+' ('+esc(B.lab)+') — slots swapped?</div>')}}));
 [0,1,2].forEach(i=>{const A=v('R'+i),B=v('O'+i);if(A&&B&&A.key&&B.key&&A.key!==B.key)L.push('<div class="bad">⚠ ROAV and Order files for '+DN[i]+' have different dates ('+esc(A.lab)+' vs '+esc(B.lab)+')</div>')});
 $('chk').innerHTML=L.join('')}
function drawDay(){const ds=[0,1,2].filter(i=>D.R[i]||D.O[i]);$('dsel').innerHTML=ds.map(i=>'<option value="'+i+'"'+(i===day?' selected':'')+'>'+DN[i]+(lb(i)?' ('+esc(lb(i))+')':'')+'</option>').join('')||'<option>—</option>'}
function drawCities(){const q=$('cs').value.toLowerCase(),all=[...CN].sort((a,b)=>a[1].localeCompare(b[1])).filter(([k,v])=>v.toLowerCase().includes(q)||CS.has(k));VIS=all.map(x=>x[0]);
 $('cl').innerHTML=all.map(([k,v])=>'<option value="'+esc(k)+'"'+(CS.has(k)?' selected':'')+'>'+esc(v)+'</option>').join('');cnt()}
const cnt=()=>$('cn').textContent=CS.size?CS.size+' city selected':'All cities';

/* ===== tables ===== */
function T(head,rows,tot){return'<div class="wrap"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+(tot?'<tr class="tot">'+tot.map(c=>'<td>'+c+'</td>').join('')+'</tr>':'')+'</tbody></table></div>'}
const empty=t=>'<div class="card">⬆ Upload the '+t+' CSV for the selected day to see this.</div>';
const sel=(o,cur,c)=>'<select data-c="'+c+'">'+o.map(x=>'<option value="'+x[0]+'"'+(x[0]===cur?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select>';
const dl=()=>' <span class="mut">'+DN[day]+(lb(day)?' · '+esc(lb(day)):'')+'</span>';
const mz=(m,v)=>v==null||v===0?'·':show(m,v);

function t0(){const rs=fR(day);if(!rs)return empty('ROAV');const M=MET.filter(m=>MR.includes(m[0])),row=(l,a)=>{const s=S(a,[]);return[esc(l),...M.map(m=>show(m,m[2](s)))]};
 const gh=grp(rs,x=>x.h),gc=grp(rs,x=>x.c),hd=['',...M.map(m=>m[1])],cs=[...gc.keys()].sort((a,b)=>gc.get(b).length-gc.get(a).length);
 const mm=MET.find(m=>m[0]===V.xm),tt=a=>show(mm,mm[2](S(a,[])));
 return'<div class="card"><h3>Hour-wise ROAV'+dl()+'</h3>'+T(['Hour',...hd.slice(1)],HRS.map(h=>row(HL(h),gh.get(h)||[])),row('Total',rs))+
 '<h3>City-wise ROAV'+dl()+'</h3>'+T(['City',...hd.slice(1)],cs.map(c=>row(CN.get(c),gc.get(c))),row('Total',rs))+
 '<h3>City × Hour — '+sel(MET.filter(m=>MR.includes(m[0])).map(m=>[m[0],m[1]]),V.xm,'xm')+dl()+'</h3>'+
 T(['City ↓ / Hour →',...HRS.map(HL),'Total'],cs.map(c=>{const g=grp(gc.get(c),x=>x.h);return[esc(CN.get(c)),...HRS.map(h=>g.has(h)?show(mm,mm[2](S(g.get(h),[]))):'·'),tt(gc.get(c))]}),['Total',...HRS.map(h=>gh.has(h)?tt(gh.get(h)):'·'),tt(rs)])+'</div>'}

function chg(a,b,m){if(a==null||b==null)return'-';const d=m[3]?a-b:(b?(a-b)/b*100:(a?Infinity:0));if(d===0)return'0';const up=d>0,good=up!==['bl','blp','pe','ot','oo'].includes(m[0]);
 const t=d===Infinity?'new':(up?'+':'')+d.toFixed(m[3]?1:0)+(m[3]?' pp':'%');return'<span class="'+(good?'up':'dn')+'">'+(up?'▲ ':'▼ ')+t+'</span>'}
function t1(){const idx=[0,1,2].filter(i=>D.R[i]||D.O[i]);if(!idx.length)return empty('ROAV / Order');
 const m=MET.find(x=>x[0]===V.cm),dim=V.cd,SP='\u0001',kf=dim==='h'?x=>x.h:dim==='c'?x=>x.c:x=>x.c+SP+x.h;
 const G=idx.map(i=>({g:g2(fR(i)||[],fO(i)||[],kf),hr:!!D.R[i],ho:!!D.O[i],i})),keys=new Set();G.forEach(x=>x.g.forEach((_,k)=>keys.add(k)));
 let ks=dim==='h'?HRS:[...keys];if(dim==='c')ks.sort((a,b)=>CN.get(a).localeCompare(CN.get(b)));
 if(dim==='ch')ks.sort((a,b)=>{const[c1,h1]=a.split(SP),[c2,h2]=b.split(SP);return CN.get(c1).localeCompare(CN.get(c2))||h1-h2});

 else if(t.id==='dsel'){day=+t.value;render()}
 else if(t.id==='dd')proc();
 else if(t.id==='cl'){const s=[...t.selectedOptions].map(o=>o.value);CS=new Set([...CS].filter(k=>!VIS.includes(k)).concat(s));cnt();render()}});
$('cs').oninput=drawCities;

$('tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b){cur=+b.dataset.t;render()}};

drawDay();drawCities();render();
